name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip setuptools
          pip install -e ".[dev]"
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && echo "$PWD" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check .
      - name: Tests (unit, plus the scanners against both sample apps)
        run: pytest
      - name: Bandit on the reporter itself
        run: bandit -q -c pyproject.toml -r secureflow
      - name: Dependency audit of the reporter's environment
        run: pip-audit

  # Dogfooding: run the reusable pipeline on this repository. The vulnerable sample is expected to
  # produce findings, so the gate is off here; the alerts land in the Security tab as the live demo.
  pipeline:
    uses: ./.github/workflows/secureflow.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      paths: "."
      fail-on: none

  # The gate must pass on the fixed sample at the strictest threshold.
  gate-fixed-app:
    uses: ./.github/workflows/secureflow.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      paths: samples/fixed-app
      fail-on: low
      scan-git-history: false
      upload-sarif: false
      comment-on-pr: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t secureflow .
      - name: Run the container against the fixed sample
        run: docker run --rm -v "$PWD/samples/fixed-app:/src" -e SECUREFLOW_FAIL_ON=low secureflow
