version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # do not propose a release until it has been public for a week
  - package-ecosystem: pip
    directory: /samples/fixed-app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
